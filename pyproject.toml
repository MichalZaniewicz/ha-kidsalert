[project]
name = "ha-kidsalert"
version = "0.1.0"
description = "Home Assistant integration for KidsAlert (kidsalert.pl) alerts with bundled dashboard cards"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["custom_components.kidsalert"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FURB", "G", "I", "LOG", "N", "PERF",
  "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T20", "TC",
  "TRY", "UP", "W",
]
ignore = [
  "D100", "D102", "D103", "D105", "D107", "D202", "D203", "D213", "D401",
  "PLR0913", "PLR2004", "RUF012", "TRY003", "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0917", "RUF001", "S101", "SLF001", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.kidsalert", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
